# Agent Factory — variant A (Claude adapter). Starting values for evaluation, not an optimum.
schema_version: 1
data_dir: "~/.local/share/agent-factory"   # runtime state outside the repo: SQLite, artifacts, worktrees, logs
execution:
  max_active_jobs: 1
  max_agent_processes: 4
  max_builders_per_job: 3              # >1: independent ready tasks built in parallel in lanes (lanes.py)
  max_test_processes: 2
  max_integration_candidates: 1
  lease_ttl_seconds: 120
  heartbeat_seconds: 20
  command_timeout_seconds: 600
  reviewer_timeout_seconds: 900
  agent_stall_seconds: 300            # no new CLI stream events => abort and retry
  job_deadline_minutes: 120
attempts:
  intake: 2
  feature_analysis_rounds: 3
  task_build_and_review: 3
  total_feature_build_attempts: 30
  integration_rebuilds: 2
  structured_output_repair: 1
budget:
  currency: USD
  hard_limit_per_job: 25
  warning_fraction: 0.70
  reserve_for_verification_fraction: 0.25
  unknown_price_policy: require_operator_limit
  plan_approval: required             # after the plan: cost estimate for approval (`factory plan approve`)
  auto_approve_below_usd: 5            # small changes start without approval
  max_cost_per_agent_call: 1.50        # conservative reservation and --max-budget-usd per call
policy:
  mode: local                          # offline | local | pr | automerge | release
  deploy: false
  external_messages: false
  protected_paths:                     # transitive evaluation inputs: the builder must not change them
    - "factory/*"
    - "openspec/*"
    - ".github/*"
    - "pytest.ini"
    - "conftest.py"
    - "*/conftest.py"
    - "setup.cfg"
    - "tox.ini"
    - "pyproject.toml"
    - "package.json"
    - "package-lock.json"
    - "tsconfig*.json"
    - "eslint.config.*"
    - ".jscpd.json"                    # quality checks and their baselines (engineering-principles)
    - ".jscpd-baseline.json"
    - ".dependency-cruiser.*"
    - "ruff.toml"
    - ".importlinter"
    - "clippy.toml"
    - "deny.toml"
    - "checkstyle*.xml"
    - "pmd*.xml"
    - "jest.config.*"
    - "vitest.config.*"
    - "Makefile"
  risk_path_rules:
    high: ["*auth*", "*login*", "*permission*", "*migrations/*", "*secret*", "*payment*"]
    medium: ["*api*", "*models*", "*schema*", "*db*"]
merge:
  enabled: false                       # enable once the target repo is configured
  human_interaction: "off"             # off | before_merge | on_risk (string, not boolean)
  human_review_risk_levels: [high]
  approval_timeout_action: wait
  require_current_head: true
  require_required_checks: true
  allow_admin_bypass: false
spec:
  # guided: after intake the job waits for answers to product decisions (`factory decide`);
  # auto: the proposed answers are accepted. The mode is chosen per job with `factory submit --mode`.
  default_mode: guided
  max_decisions: 7
browser:
  # Browser for ui-review and product-verify: the controller serves the build from the check manifest's `preview`
  # on 127.0.0.1, and the reviewer views it through Playwright CLI (screenshots, accessibility snapshot, console).
  tool: playwright-cli
  binary: tools/playwright-cli/node_modules/.bin/playwright-cli
  viewports: ["390x844", "1280x800"]
  idle_timeout_ms: 300000
design:
  # Visual direction of the target repo (tokens, typography, motion, patterns). When it is missing, intake asks
  # for a direction (guided), and the first UI task records it. ui-review compares screens with it and with reference images.
  doc: docs/DESIGN.md
  references_dir: docs/design
  min_visual_score: 3                  # 1-5 score from screenshots; PASS with a lower score => CHANGES
review:
  # Task reviews in tiers: CHANGES in a tier skips the following ones (they run after the fix).
  # Cheaper reviewer models for low-risk tasks: models.yaml `review_models`.
  tiers:
    - [code-review, test-adequacy, ui-review]
    - [product-verify, security-review]
  security:
    # Per task: baseline review (model review_models.security_baseline) with triggers from the diff and known findings.
    # Full threat analysis of the whole diff once per feature before acceptance: off | on_trigger | always.
    feature_review: on_trigger
    full_per_task_for_risk: []         # e.g. [high]: additionally a full review of every task
runtime:
  sandbox: required
  # Models, roles, routing and agent providers: factory/models.yaml (the only place models are selected).
