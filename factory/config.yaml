# Agent Factory — wariant A (adapter Claude). Wartości startowe do ewaluacji, nie optimum.
schema_version: 1
data_dir: "~/.local/share/agent-factory"   # stan runtime poza repo: SQLite, artefakty, worktree, logi
execution:
  max_active_jobs: 1
  max_agent_processes: 4
  max_builders_per_job: 3              # >1: niezależne gotowe taski budowane równolegle w torach (lanes.py)
  max_test_processes: 2
  max_integration_candidates: 1
  lease_ttl_seconds: 120
  heartbeat_seconds: 20
  command_timeout_seconds: 600
  reviewer_timeout_seconds: 900
  agent_stall_seconds: 300            # brak nowych zdarzeń strumienia CLI => przerwij i ponów
  job_deadline_minutes: 120
attempts:
  intake: 2
  feature_analysis_rounds: 3
  task_build_and_review: 3
  total_feature_build_attempts: 30
  integration_rebuilds: 2
  structured_output_repair: 1
budget:
  currency: USD
  hard_limit_per_job: 25
  warning_fraction: 0.70
  reserve_for_verification_fraction: 0.25
  unknown_price_policy: require_operator_limit
  plan_approval: required             # po planie: szacunek kosztu do akceptacji (`factory plan approve`)
  auto_approve_below_usd: 5            # małe zmiany ruszają bez akceptacji
  max_cost_per_agent_call: 1.50        # konserwatywna rezerwacja i --max-budget-usd na wywołanie
policy:
  mode: local                          # offline | local | pr | automerge | release
  deploy: false
  external_messages: false
  protected_paths:                     # transytywne wejścia oceny: builder nie może ich zmieniać
    - "factory/*"
    - "openspec/*"
    - ".github/*"
    - "pytest.ini"
    - "conftest.py"
    - "*/conftest.py"
    - "setup.cfg"
    - "tox.ini"
    - "pyproject.toml"
    - "package.json"
    - "package-lock.json"
    - "tsconfig*.json"
    - "eslint.config.*"
    - ".jscpd.json"                    # kontrole jakości i ich baseline (engineering-principles)
    - ".jscpd-baseline.json"
    - ".dependency-cruiser.*"
    - "ruff.toml"
    - ".importlinter"
    - "clippy.toml"
    - "deny.toml"
    - "checkstyle*.xml"
    - "pmd*.xml"
    - "jest.config.*"
    - "vitest.config.*"
    - "Makefile"
  risk_path_rules:
    high: ["*auth*", "*login*", "*permission*", "*migrations/*", "*secret*", "*payment*"]
    medium: ["*api*", "*models*", "*schema*", "*db*"]
merge:
  enabled: false                       # włącz raz po konfiguracji docelowego repo
  human_interaction: "off"             # off | before_merge | on_risk (tekst, nie boolean)
  human_review_risk_levels: [high]
  approval_timeout_action: wait
  require_current_head: true
  require_required_checks: true
  allow_admin_bypass: false
spec:
  # guided: po intake job czeka na odpowiedzi na decyzje produktowe (`factory decide`);
  # auto: przyjmowane są proponowane odpowiedzi. Tryb wybiera się per job przy `factory submit --mode`.
  default_mode: guided
  max_decisions: 7
browser:
  # Przeglądarka dla ui-review i product-verify: kontroler serwuje build z `preview` manifestu checków
  # na 127.0.0.1, a recenzent ogląda go przez Playwright CLI (zrzuty, snapshot dostępności, konsola).
  tool: playwright-cli
  binary: tools/playwright-cli/node_modules/.bin/playwright-cli
  viewports: ["390x844", "1280x800"]
  idle_timeout_ms: 300000
review:
  # Recenzje tasków w poziomach: CHANGES w poziomie pomija kolejne (uruchomią się po poprawce).
  # Tańsze modele recenzentów dla tasków niskiego ryzyka: models.yaml `review_models`.
  tiers:
    - [code-review, test-adequacy, ui-review]
    - [product-verify, security-review]
runtime:
  sandbox: required
  # Modele, role, routing i dostawcy agentów: factory/models.yaml (jedyne miejsce wyboru modeli).
