# Factory model selection — the only place where models are set (config.yaml does not contain them).
# Changing this file changes policy_digest: evidence collected under the old configuration is no longer current.
# Description and rules: docs/factory/model-routing.md. Before changing a role's model, compare it with `factory eval`.
schema_version: 1

# How the agent is run (a program with tools, not the bare API: roles read the repo and edit files).
# Each one runs in the factory sandbox. pass_env: {variable in the agent: variable on the operator side} — only these
# variables reach the agent (the agent can read them; for shared keys a proxy is better).
runtimes:
  claude:
    binary: claude
    min_cli_version: "2.1.280"          # older CLIs do not support 5.x models (the API rejects the request)
  codex:                                # OpenAI; login via `codex login` (ChatGPT) or an API key
    binary: tools/codex/node_modules/.bin/codex
    pass_env: { OPENAI_API_KEY: OPENAI_API_KEY }
  opencode:                             # Gemini, OpenAI, Anthropic API and servers from `endpoints`
    binary: tools/opencode/node_modules/.bin/opencode
    pass_env:
      GOOGLE_GENERATIVE_AI_API_KEY: GEMINI_API_KEY
      OPENAI_API_KEY: OPENAI_API_KEY

# Model servers compatible with the OpenAI API (Ollama, LM Studio, llama.cpp, vLLM): on this machine or on
# others (e.g. several Mac minis). A role with `endpoints` gets a free and reachable server from the pool; when none
# is free, it uses `fallback`. Address outside this machine: use TLS or a VPN (e.g. Tailscale).
endpoints: {}
#  mini-1: { base_url: "http://10.0.0.11:11434/v1", models: ["qwen3-coder:30b"], max_concurrent: 2 }
#  mini-2: { base_url: "http://10.0.0.12:11434/v1", models: ["qwen3-coder:30b"], max_concurrent: 2 }

# Prices of models whose runtime reports tokens but not cost (codex). Without a price, the call's cost is
# counted as the full budget reservation.
prices: {}
#  gpt-5.5-codex: { input_per_mtok: 1.25, output_per_mtok: 10.0 }

# Model of each role. runtime: claude | codex | opencode. Model names: claude → claude-sonnet-5-5;
# codex → OpenAI name; opencode → provider/model (google/gemini-…, openai/…) or just a model name
# from `endpoints`. Example of a role on a local pool with a cloud fallback:
#   test_reviewer: { runtime: opencode, model: "qwen3-coder:30b", endpoints: [mini-1, mini-2],
#                    tools: [Read, Glob, Grep], fallback: { runtime: claude, model: claude-sonnet-5-5 } }
roles:
  default:                { runtime: claude, model: claude-sonnet-5-5, effort: medium, tools: [Read, Glob, Grep] }
  intake:                 { runtime: claude, model: claude-haiku-5-5, tools: [Read, Glob, Grep] }
  classifier:             { runtime: claude, model: claude-sonnet-5-5, effort: medium, tools: [Read, Glob, Grep] }
  planner:                { runtime: claude, model: claude-opus-5-5, effort: high, tools: [Read, Glob, Grep] }
  decision:               { runtime: claude, model: claude-opus-5-5, effort: high, tools: [Read, Glob, Grep] }
  spec_author:            { runtime: claude, model: claude-sonnet-5-5, effort: medium, tools: [Read, Glob, Grep] }
  spec_evaluator:         { runtime: claude, model: claude-opus-5-5, effort: high, tools: [Read, Glob, Grep] }
  decomposition_reviewer: { runtime: claude, model: claude-opus-5-5, effort: high, tools: [Read, Glob, Grep] }
  builder:                { runtime: claude, model: claude-sonnet-5-5, effort: high, tools: [Read, Edit, Write, Glob, Grep, Bash] }
  code_reviewer:          { runtime: claude, model: claude-opus-5-5, effort: medium, tools: [Read, Glob, Grep] }
  security_reviewer:      { runtime: claude, model: claude-opus-5-5, effort: high, tools: [Read, Glob, Grep] }
  ui_reviewer:            { runtime: claude, model: claude-sonnet-5-5, effort: medium, tools: [Read, Glob, Grep] }
  product_evaluator:      { runtime: claude, model: claude-sonnet-5-5, effort: medium, tools: [Read, Glob, Grep, Bash] }
  test_reviewer:          { runtime: claude, model: claude-sonnet-5-5, effort: medium, tools: [Read, Glob, Grep] }
  integration_evaluator:  { runtime: claude, model: claude-opus-5-5, effort: medium, tools: [Read, Glob, Grep] }

# Builder model by task difficulty (planner + controller lower bound + optionally Jev).
# The model must work in the builder role's runtime.
routing:
  builder_models:
    easy: claude-sonnet-5-5
    medium: claude-sonnet-5-5
    hard: claude-opus-5-5
  escalate_on_retry: true               # each subsequent task attempt: model one level higher
  trivial_path_model: claude-haiku-5-5  # only very small changes (trivial path), 1st attempt

# Cheaper task reviewers at low risk (feature acceptance and integration are always full).
review_models:
  for_risk: [low]
  models:
    code_reviewer: claude-sonnet-5-5
    security_reviewer: claude-sonnet-5-5
  # Per-task security review (baseline) on this model; full threat analysis (security_reviewer role)
  # once per feature on the whole diff (config.yaml review.security).
  security_baseline: claude-sonnet-5-5

# Second opinion on task difficulty from the Jev decision model (TypeSafe AI). Works only when the
# TYPESAFE_API_KEY variable is set; without it the step is skipped. Sends the task record (paths,
# acceptance criteria) to api.typesafe.ai — set provider: none if that is not allowed.
decision_model:
  provider: jev
  model: jev-latest
  min_confidence: 0.6
  timeout_seconds: 10
