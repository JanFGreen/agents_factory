# Trusted check manifest for Node/TypeScript repos (vitest + tsc + eslint).
# Dependencies are installed by the operator in the repo checkout (`npm ci`) and linked
# into each worktree (tools must not write into it, hence vitest's runner config loader); checks never reach the network, so a new dependency needs the operator.
schema_version: 1
link_from_checkout: ["node_modules"]
preview:                                 # build of the web-build check, served for UI review in a browser
  static_dir: dist
  spa_fallback: true
checks:
  - name: unit
    argv: ["{worktree}/node_modules/.bin/vitest", "run", "--configLoader", "runner", "--reporter=default", "--reporter=junit", "--outputFile.junit={report}"]
    timeout_seconds: 900
    report: junit
    min_tests: 1
    required: true
    network: localhost
    stage: task
  - name: typecheck
    argv: ["{worktree}/node_modules/.bin/tsc", "--noEmit", "-p", "tsconfig.json"]
    timeout_seconds: 600
    required: true
    stage: task
  - name: lint
    argv: ["{worktree}/node_modules/.bin/eslint", ".", "--max-warnings=0"]
    timeout_seconds: 600
    required: true
    stage: task
  - name: duplicates                    # EP-4: no new copied block; known clones live in the protected baseline
    argv: ["{worktree}/node_modules/.bin/jscpd", "--config", ".jscpd.json", "--baseline", ".jscpd-baseline.json", "--fail-on-new-clones"]
    timeout_seconds: 300
    required: true
    stage: task
  - name: sast                          # semgrep with the factory's local rules (offline); only code added relative to the job base
    argv: ["{factory}/tools/semgrep/.venv/bin/semgrep", "scan", "--config", "{factory}/factory/checks/semgrep/security.yml",
           "--baseline-commit", "{base_sha}", "--error", "--metrics=off", "--disable-version-check", "--quiet", "."]
    timeout_seconds: 600
    required: true
    stage: task
  - name: web-build
    argv: ["{worktree}/node_modules/.bin/expo", "export", "--platform", "web", "--output-dir", "dist"]
    timeout_seconds: 900
    required: true
    stage: task
