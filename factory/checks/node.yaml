# Trusted check manifest for Node/TypeScript repos (vitest + tsc + eslint).
# Dependencies are installed by the operator in the repo checkout (`npm ci`) and linked
# into each worktree (tools must not write into it, hence vitest's runner config loader); checks never reach the network, so a new dependency needs the operator.
schema_version: 1
link_from_checkout: ["node_modules"]
preview:                                 # build of the web-build check, served for UI review in a browser
  static_dir: dist
  spa_fallback: true
  backend:                               # the app's API server for the feature walkthrough (screens behind sign-in)
    argv: ["node", "--import", "tsx", "src/server/main.ts"]   # not the tsx CLI: its IPC socket path in TMPDIR is too long
    env: {HOST: "127.0.0.1", PORT: "{port}", JWT_SECRET: "{secret}", LEARNENGLISH_DB: "{scratch}/preview.db", CORS_ORIGIN: "{origin}"}
    build_url: "http://127.0.0.1:3000"   # expo.extra.apiBaseUrl in app.json; the preview serves the build with the real URL
    ready_path: /health
  seed:                                  # sample data for browser reviews: a learner with reviews due (scripts/preview-seed.ts)
    argv: ["node", "--import", "tsx", "scripts/preview-seed.ts", "{out}", "{origin}"]
    shows: "an A1 learner with 3 reviews due now, 10 new words, 20 known words and 5 words to learn"
checks:
  - name: unit
    argv: ["{worktree}/node_modules/.bin/vitest", "run", "--configLoader", "runner", "--reporter=default", "--reporter=junit", "--outputFile.junit={report}"]
    timeout_seconds: 900
    report: junit
    min_tests: 1
    required: true
    network: localhost
    stage: task
  - name: typecheck
    argv: ["{worktree}/node_modules/.bin/tsc", "--noEmit", "-p", "tsconfig.json"]
    timeout_seconds: 600
    required: true
    stage: task
  - name: lint
    argv: ["{worktree}/node_modules/.bin/eslint", ".", "--max-warnings=0"]
    timeout_seconds: 600
    required: true
    stage: task
  - name: duplicates                    # EP-4: no new copied block; known clones live in the protected baseline
    argv: ["{worktree}/node_modules/.bin/jscpd", "--config", ".jscpd.json", "--baseline", ".jscpd-baseline.json", "--fail-on-new-clones"]
    timeout_seconds: 300
    required: true
    stage: task
  - name: sast                          # semgrep with the factory's local rules (offline); only code added relative to the job base
    argv: ["{factory}/tools/semgrep/.venv/bin/semgrep", "scan", "--config", "{factory}/factory/checks/semgrep/security.yml",
           "--baseline-commit", "{base_sha}", "--error", "--metrics=off", "--disable-version-check", "--quiet", "."]
    timeout_seconds: 600
    required: true
    stage: task
  - name: hygiene                       # production readiness and third-party loads in added lines (semgrep, offline)
    argv: ["{factory}/tools/semgrep/.venv/bin/semgrep", "scan", "--config", "{factory}/factory/checks/semgrep/hygiene.yml",
           "--baseline-commit", "{base_sha}", "--error", "--emacs", "--metrics=off", "--disable-version-check", "--quiet", "."]  # one line per finding
    timeout_seconds: 600
    required: true
    stage: task
  - name: licenses                      # every shipped npm package has an allowed licence (factory/checks/licenses.json)
    argv: ["{python}", "{factory}/factory/checks/licenses.py"]
    timeout_seconds: 120
    required: true
    stage: task
  - name: web-build
    argv: ["{worktree}/node_modules/.bin/expo", "export", "--platform", "web", "--output-dir", "dist"]
    timeout_seconds: 900
    required: true
    stage: task
