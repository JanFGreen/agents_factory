# Trusted command manifest. Stored in the controller, not in the job branch.
schema_version: 1
checks:
  - name: unit
    argv: ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--junitxml={report}"]
    timeout_seconds: 600
    report: junit
    min_tests: 1
    required: true
    network: localhost
    stage: task
  - name: sast                          # semgrep with the factory's local rules (offline); only code added relative to the job base
    argv: ["{factory}/tools/semgrep/.venv/bin/semgrep", "scan", "--config", "{factory}/factory/checks/semgrep/security.yml",
           "--baseline-commit", "{base_sha}", "--error", "--metrics=off", "--disable-version-check", "--quiet", "."]
    timeout_seconds: 600
    required: true
    stage: task
